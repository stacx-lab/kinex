name: relative_pose
description: Transform a frame-attached pose through tf2. Use ROS frame IDs and an
  optional world timestamp. Missing frame relationships and unavailable timestamps
  are errors.
parameters:
  type: object
  additionalProperties: false
  properties:
    child: &id001
      type: object
      additionalProperties: false
      properties:
        frame:
          type: string
          description: ROS frame ID, such as arm or arm/flange.
        pose:
          type: array
          items:
            type: number
          minItems: 7
          maxItems: 7
          default:
          - 0
          - 0
          - 0
          - 0
          - 0
          - 0
          - 1
      required:
      - frame
    parent: *id001
    timestamp:
      type: number
      minimum: 0
  required:
  - child
  - parent
timeout_s: 60
devices: []
async: true
