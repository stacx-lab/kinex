name: servo
kind: controller
description: "Plan and submit a full joint trajectory for a joint device or dexterous hand. Returns immediately with device, execution_id, requested/IK-resolved target joints, computed duration_s and actions_submitted; these do not confirm arrival. Use world.wait to allow execution and measured feedback to verify arrival. Later writes or stop can interrupt the plan."
parameters:
  type: object
  additionalProperties: false
  properties: &fields
    device:
      type: string
      description: "Joint or dexterous_hand device name."
    joints:
      type: array
      items: {type: number}
      description: absolute configuration in resolved model joint order; radians or metres by joint type
    pose:
      type: array
      minItems: 7
      maxItems: 7
      items: {type: number}
      description: pose [x,y,z,qx,qy,qz,qw] of kinematics.frame, in the device canonical frame unless frame is given; requires declared endpoint IK (finger geometry alone is insufficient)
    frame:
      type: string
      description: "Pose source frame: device or device:frame; defaults to the device canonical frame."
    speedFraction:
      type: number
      exclusiveMinimum: 0
      maximum: 1
      description: "Fraction of resolved planning velocity and acceleration rates. Lower fractions lengthen the computed duration_s."
    max_joint_delta:
      oneOf:
      - {type: number, exclusiveMinimum: 0}
      - {type: array, items: {type: number, exclusiveMinimum: 0}, minItems: 1}
      description: "Optional maximum travel per submission, scalar or per joint in model order (radians or metres). No travel cap when omitted. Applies to joint and pose goals; continuous joints use shortest travel. This is a caller-selected planning constraint, not a hardware rating."
    max_velocity:
      oneOf:
      - {type: number, exclusiveMinimum: 0}
      - {type: array, items: {type: number, exclusiveMinimum: 0}, minItems: 1}
      description: "Planning rate in model order; defaults to 1 rad/s or 0.1 m/s, capped by known limits."
    max_acceleration:
      oneOf:
      - {type: number, exclusiveMinimum: 0}
      - {type: array, items: {type: number, exclusiveMinimum: 0}, minItems: 1}
      description: "Planning rate in model order; defaults to 3 rad/s² or 0.3 m/s², capped by known limits. Defaults are tool policy, not hardware ratings."
  required: [device]
  oneOf:
  - {type: object, additionalProperties: false, properties: *fields, required: [device, joints]}
  - {type: object, additionalProperties: false, properties: *fields, required: [device, pose]}
timeout_s: 600
device_inputs:
  device:
    types: [joint, dexterous_hand]
devices: []
