name: run_policy
kind: controller
description: "Infer once and submit buffered writes to the commanded devices concurrently. Starts are not atomic. Normal completion follows each device’s reference policy; timeout or faults stop commanded devices."
parameters:
  type: object
  additionalProperties: false
  properties:
    model:
      type: string
      description: model device serving an "infer" action (obs -> action)
    observation:
      type: object
      description: "Perception result containing point and frame."
    command:
      type: array
      minItems: 1
      description: "Devices in flat-vector split order; named action maps use device names. Joints use radians/metres; gripper and suction commands contain one value."
      items:
        type: object
        additionalProperties: false
        properties:
          device: {type: string, description: joint, dexterous_hand, gripper or suction device}
        required: [device]
    task:
      type: string
      description: task or goal handed to the model, e.g. a language instruction
    action_hz:
      type: number
      exclusiveMinimum: 0
      default: 10
      description: actions replayed per second of the device's own clock
    max_actions:
      type: integer
      minimum: 1
      description: keep at most this many actions from the chunk; the rest are discarded
    timeout_s:
      type: number
      exclusiveMinimum: 0
      maximum: 300
      default: 30
      description: "Motion budget in device-clock seconds."
  required: [model, observation, command]
timeout_s: 600
device_inputs:
  model:
    types: [model]
  command[].device:
    types: [joint, gripper, dexterous_hand, suction]
devices: [model]
requires: access:model,intrinsics:model
