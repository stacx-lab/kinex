name: observe
kind: perception
description: >-
  Read several devices at once and return their readings as one bundle, keyed by
  device name. Camera readings carry their image path under file. Provides the observation bundle for a standalone run_policy call. Reads are concurrent but not simultaneous: they are
  separate calls, so fast-moving state can differ slightly between them.
parameters:
  type: object
  additionalProperties: false
  properties:
    devices:
      type: array
      minItems: 1
      items: {type: string}
      description: device names to read, in order; duplicates are read once
  required: [devices]
timeout_s: 120
device_inputs:
  devices[]:
    types: [joint, gripper, dexterous_hand, suction, velocity, rgb, rgbd, force_torque, imu]
