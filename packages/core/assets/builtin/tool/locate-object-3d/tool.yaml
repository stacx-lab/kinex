name: locate_object_3d
kind: perception
description: >-
  Locate an object in the camera optical frame (+X right, +Y down, +Z forward)
  using a detection or segmentation device with RGBD or explicit optical depth.
  Samples only inside a supplied mask; otherwise uses the central half of the box.
  Returns a representative point in metres, pixel, detection_score, depth_samples,
  and reference (visible_surface or box_region). Box estimates may include background.
  rotation_xyzw is null. No mount calibration is needed; convert frames with
  relative_pose after constructing a full local pose with an explicit orientation.
parameters:
  type: object
  additionalProperties: false
  properties:
    camera:
      type: string
      description: rgb or rgbd camera with calibrated color intrinsics
    model:
      type: string
      description: detection or segmentation device serving detect(image, prompt, min_score, max_results)
    prompt:
      type: string
      minLength: 1
      description: object description, e.g. red mug
    depth:
      type: number
      exclusiveMinimum: 0
      description: optional optical Z in metres at the representative region pixel; otherwise use the captured RGBD depth
    min_score:
      type: number
      minimum: 0
      maximum: 1
      default: 0.25
      description: minimum detection score
    instance:
      type: integer
      minimum: 0
      default: 0
      description: zero-based index after filtering and sorting by descending score; ties keep model order
  required: [camera, model, prompt]
timeout_s: 300
device_inputs:
  camera:
    types: [rgb, rgbd]
  model:
    types: [detection, segmentation]
