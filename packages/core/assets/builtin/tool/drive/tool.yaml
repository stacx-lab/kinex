name: drive
kind: controller
description: "Hold a velocity/posture command for duration_s. An until predicate can end it early. Always stops on exit; reached means the duration completed."
parameters:
  type: object
  additionalProperties: false
  properties:
    device:
      type: string
      description: "Device name."
    mode:
      type: string
      description: controller preset name declared in control.modes
    velocity:
      type: object
      additionalProperties:
        type: number
      description: "Preset velocity axes; omitted axes are zero."
    posture:
      type: object
      additionalProperties:
        type: number
      description: "Preset posture axes; omitted axes use declared defaults."
    duration_s:
      type: number
      exclusiveMinimum: 0
      description: "Hold duration in device-clock seconds."
      maximum: 300
    until:
      type: object
      additionalProperties: false
      description: "Perception predicate checked before motion and at checkpoints; a truthy key stops."
      properties:
        tool:
          type: string
        args:
          type: object
        key:
          type: string
          description: 'result key to test (default: done)'
        every_s:
          type: number
          exclusiveMinimum: 0
          description: 'seconds of the device''s own clock between checks (default: 1)'
      required:
      - tool
  required:
  - device
  - mode
  - duration_s
timeout_s: 600
device_inputs:
  device:
    types:
    - velocity
devices: []
