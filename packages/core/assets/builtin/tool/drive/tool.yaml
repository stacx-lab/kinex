name: drive
kind: controller
description: Hold a velocity/posture command for duration_s of the device clock. Omitted velocity
  axes are zero; omitted posture axes use preset defaults. Commands must match the preset axes, units
  and bounds. Optional until checks a perception predicate before motion and between bounded writes.
  Stops on completion, predicate, fault or error. Returns reached (duration completed), terminated_by,
  elapsed_s and final state. No displacement control, navigation or balance guarantee.
parameters:
  type: object
  additionalProperties: false
  properties:
    device:
      type: string
      description: velocity-controlled device name
    mode:
      type: string
      description: controller preset name declared in control.modes
    velocity:
      type: object
      additionalProperties:
        type: number
      description: axis values for the preset's declared velocity components, e.g. {vx, vy, wz};
        omitted axes are commanded at zero
    posture:
      type: object
      additionalProperties:
        type: number
      description: axis values for the preset's declared posture components, e.g. {height, pitch};
        omitted axes keep their declared default
    duration_s:
      type: number
      exclusiveMinimum: 0
      description: how long to hold the commanded velocity/posture, in seconds of the device's own
        clock
      maximum: 300
    until:
      type: object
      additionalProperties: false
      description: optional extra termination predicate - a PERCEPTION tool whose truthy key stops
        the loop
      properties:
        tool:
          type: string
        args:
          type: object
        key:
          type: string
          description: 'result key to test (default: done)'
        every_s:
          type: number
          exclusiveMinimum: 0
          description: 'seconds of the device''s own clock between checks (default: 1)'
      required:
      - tool
  required:
  - device
  - mode
  - duration_s
timeout_s: 600
device_inputs:
  device:
    types:
    - velocity
devices: []
