name: track
kind: controller
description: "Repeat perceive → process → control until a predicate or round/miss limit. Each controller call owns its time bounds. Stops owned motion on misses and exit."
parameters:
  type: object
  additionalProperties: false
  properties:
    perceive:
      type: object
      additionalProperties: false
      properties:
        tool: {type: string}
        args: {type: object}
      required: [tool]
    process:
      type: object
      additionalProperties: false
      properties:
        tool: {type: string}
        args: {type: object}
      required: [tool]
      description: "Receives perception as observation, overriding configured observation. Returns {args: object} to overlay control.args, or {args: null} to skip control and count a miss."
    control:
      type: object
      additionalProperties: false
      properties:
        tool: {type: string}
        args: {type: object}
      required: [tool]
      description: "Bounded controller call. Results are returned as last, not interpreted; failures must raise errors."
    until:
      type: object
      additionalProperties: false
      description: "Predicate checked before the first round and after every round; a truthy key ends tracking."
      properties:
        tool: {type: string}
        args: {type: object}
        key: {type: string, description: "Result key to test (default: done)."}
      required: [tool]
    max_misses:
      type: integer
      minimum: 1
      default: 3
      description: "Consecutive processing misses before stopping."
    max_rounds:
      type: integer
      minimum: 1
      default: 200
      description: "Maximum perceive/process/control rounds."
  required: [perceive, process, control]
timeout_s: 900
devices: []
