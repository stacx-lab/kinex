name: closed_loop
kind: controller
description: >-
  A successful control call does not guarantee the intended physical outcome.
  Close the gap between commanded and measured results by observing feedback
  and repeating or adjusting control until a stopping condition or round limit,
  using world-time waits. For joint arrival, use servo as control and settled as
  until; for repeated policy inference, use run_policy with fresh observations.
  Optional perceive, process, control and until stages accept tools or inline
  Python; omitted or null stages return an empty object. Stops owned motion on
  misses and exit.
parameters:
  type: object
  additionalProperties: false
  properties:
    world: {type: string, description: World clock device.}
    wait_s: {type: number, exclusiveMinimum: 0, description: 'Observation/replanning interval in world seconds after each control call. The next call may replace a pending trajectory before it completes.'}
    stop_after_control: {type: boolean, default: false, description: Stop owned motion after each wait.}
    perceive:
      default: null
      oneOf: &call
        - {type: 'null'}
        - type: object
          additionalProperties: false
          properties:
            tool: &tool {type: string, minLength: 1}
            args: {type: object}
          required: [tool]
        - type: object
          additionalProperties: false
          properties:
            python: &python {type: string, minLength: 1, description: 'Python lambda or source defining main; called with keyword arguments, returns JSON data. Supports imports. Each call uses a fresh process; only inline control may command devices.'}
            args: {type: object}
          required: [python]
    process:
      default: null
      oneOf: &stage
        - {type: 'null'}
        - type: object
          additionalProperties: false
          properties:
            tool: *tool
            args: {type: object}
            inputs: &inputs
              type: object
              propertyNames: {type: string, pattern: '^/'}
              additionalProperties: {type: string, pattern: '^(?:/|$)'}
              description: Destination argument JSON Pointer to previous result JSON Pointer. Selected values override args. Null values skip the round; missing paths are errors.
          required: [tool]
        - type: object
          additionalProperties: false
          properties:
            python: *python
            args: {type: object}
            inputs: *inputs
          required: [python]
      description: Receives observation by default. With inputs, receives only mapped fields and static args. Returns a dict or null to skip control. Omitted or null stage returns an empty object, without forwarding observation.
    control:
      default: null
      oneOf: *stage
      description: Process fields override args by default; inputs selects fields explicitly. Result is passed to until.
    until:
      default: null
      oneOf: *call
      description: Receives context and previous state; returns optional done (boolean, default false), state and reason. Checked before the first round and after each wait. Omitted or null stage never ends the loop early.
    max_misses: {type: integer, minimum: 1, default: 3}
    max_rounds: {type: integer, minimum: 1, default: 200}
  required: [world, wait_s]
timeout_s: 900
device_inputs:
  world:
    types: [world]
devices: []
