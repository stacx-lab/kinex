name: move_to
kind: controller
description: "Move to one fixed joint or pose goal and verify quiet arrival. Plans a joint trajectory and submits buffered writes; no collision avoidance. Timeout stops motion. Use track to update the goal from perception."
parameters:
  type: object
  additionalProperties: false
  properties: &fields
    device:
      type: string
      description: "Device name."
    joints:
      type: array
      items: {type: number}
      description: absolute configuration in resolved model joint order; radians or metres by joint type
    pose:
      type: array
      minItems: 7
      maxItems: 7
      items: {type: number}
      description: pose [x,y,z,qx,qy,qz,qw] of kinematics.frame, in the device canonical frame unless frame is given; requires declared IK
    frame:
      type: string
      description: "Pose source frame: device or device:frame; defaults to the device canonical frame."
    speedFraction:
      type: number
      exclusiveMinimum: 0
      maximum: 1
      description: "Fraction of resolved planning velocity and acceleration rates."
    max_velocity:
      oneOf:
      - {type: number, exclusiveMinimum: 0}
      - {type: array, items: {type: number, exclusiveMinimum: 0}, minItems: 1}
      description: "Planning rate in model order; defaults to 1 rad/s or 0.1 m/s, capped by known limits."
    max_acceleration:
      oneOf:
      - {type: number, exclusiveMinimum: 0}
      - {type: array, items: {type: number, exclusiveMinimum: 0}, minItems: 1}
      description: "Planning rate in model order; defaults to 3 rad/s² or 0.3 m/s², capped by known limits. Defaults are tool policy, not hardware ratings."
    joint_tolerance:
      oneOf:
      - {type: number, exclusiveMinimum: 0}
      - {type: array, items: {type: number, exclusiveMinimum: 0}, minItems: 1}
      default: 0.01
      description: scalar or per-joint values in model order; radians/metres
    quiet_velocity:
      oneOf:
      - {type: number, exclusiveMinimum: 0}
      - {type: array, items: {type: number, exclusiveMinimum: 0}, minItems: 1}
      default: 0.005
      description: scalar or per-joint values in model order; radians/metres per second
    stable_s:
      type: number
      exclusiveMinimum: 0
      default: 0.1
      description: "Required time within position and velocity tolerances, in device seconds."
    timeout_s:
      type: number
      exclusiveMinimum: 0
      maximum: 300
      description: "Motion budget in device-clock seconds."
    until:
      type: object
      additionalProperties: false
      description: "Perception predicate checked before motion and at checkpoints; a truthy key stops."
      properties:
        tool: {type: string}
        args: {type: object}
        key: {type: string, description: "result key to test (default: done)"}
        every_s: {type: number, exclusiveMinimum: 0, description: "seconds of the device's own clock between checks (default: 1)"}
      required: [tool]
  required: [device, timeout_s]
  oneOf:
  - {type: object, additionalProperties: false, properties: *fields, required: [device, timeout_s, joints]}
  - {type: object, additionalProperties: false, properties: *fields, required: [device, timeout_s, pose]}
timeout_s: 600
device_inputs:
  device:
    types: [joint]
devices: []
