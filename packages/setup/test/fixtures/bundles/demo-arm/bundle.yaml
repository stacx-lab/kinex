version: 1
name: demo-arm
device: {type: joint}
robot: {kind: arm, model_fact: arm_type}
parent: null
ros: {distros: [jazzy], rmw: rmw_cyclonedds_cpp, python: /usr/bin/python3}
facts:
  - {key: robot_ip, type: ip, required: true, description: "Controller IP"}
  - {key: arm_type, type: enum, enum: [demo5, demo10], required: true, description: "Arm model"}
  - {key: ros_distro, type: enum, enum: [jazzy], default: {detect: ros_distro}}
  - {key: domain_id, type: int, min: 0, max: 232, default: 0}
  - {key: namespace, type: string, pattern: "^(/?[A-Za-z_][A-Za-z0-9_/]*)?$", default: ""}
  - {key: name, type: string, pattern: "^[a-zA-Z0-9][a-zA-Z0-9_-]*$", default: demo-arm}
  - {key: network_interface, type: string, default: eth0, ask: false}
  - {key: conn_type, type: enum, enum: [native, webrtc], default: native}
  - {key: firmware, type: string, pattern: "^[0-9]+(\\.[0-9]+)*$", default: "1.0.0", ask: false}
  - {key: use_mock_hardware, type: bool, default: false, ask: false}
  - {key: timestamp_source, type: enum, enum: [header, receipt], default: header, ask: false}
secrets: [ROBOT_AES_KEY]
pins:
  apt: ["ros-${ros_distro}-demo-driver", python3-yaml]
  pip: []
  git: []
preflight:
  - {id: linux, kind: platform, value: linux}
  - {id: distro, kind: file, path: "${ros_root}/${ros_distro}/setup.bash"}
  - {id: python_version, kind: python, min: "3.12"}
  - {id: reach, kind: command, argv: [ping, -c, "1", -W, "1", "${robot_ip}"], skip_when: use_mock_hardware}
  - {id: apt, kind: apt, packages: pins.apt}
  - {id: secrets, kind: env_file, names: secrets, skip_when: use_mock_hardware}
manual_steps:
  - {id: enable_remote, when: before_stack, text: "Enable remote control on the teach pendant and press Play."}
stack:
  launch: {package: demo_driver, file: demo_control.launch.py,
           args: "arm_type:=${arm_type} robot_ip:=${robot_ip} launch_rviz:=false use_mock_hardware:=${use_mock_hardware}"}
  env: {DEMO_IP: "${robot_ip}"}
  ready_topics: [/joint_states]
  ready_timeout_s: 60
  stop: {signal: INT, timeout_s: 10}
expected:
  topics:
    - {name: /joint_states, type: sensor_msgs/msg/JointState, min_hz: 100, required: true}
  controllers:
    - {name: joint_trajectory_controller, state: active, required: true}
  joints: [joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
  frames: [base_link, tool0]
  domain: true
driver:
  adapter: JointTrajectoryDriver
  controller: joint_trajectory_controller
  state_topic: "${namespace}/joint_states"
  command_topic: "${namespace}/joint_trajectory_controller/joint_trajectory"
  action: "${namespace}/joint_trajectory_controller/follow_joint_trajectory"
  period_s: 0.02
  time_from_start_s: 0.04
  stale_periods: 5
  timeout_s: 90
  clock: {max_skew_s: 0.5}
  stop:
    method: measured_position_and_cancel
    confirm: {max_speed: 0.01, units: rad/s, timeout_s: 0.5}
    driver_loss: {command_timeout_s: 0.04, source: "JTC finishes the last one-point segment and holds"}
profile:
  intrinsics:
    kinematics: {frame: tool0, fk: numerical,
                 ik: {backend: numerical, method: damped_least_squares, position_tolerance_m: 0.001,
                      rotation_tolerance_rad: 0.001, max_iterations: 200, damping: 0.01},
                 frame_to_reported: [0, 0, 0, 0, 0, 0, 1]}
    model: {format: urdf, path: model.urdf, base_link: base_link, tip_link: tool0}
    home: null
    control: {mode: position}
    feedback: {velocities: true, efforts: true}
    stop: {behavior: hold, affected_devices: ["${name}"]}
  extrinsics: {mount: "???"}
recipe:
  nodes:
    - {id: "${name}-access", title: "Prepare ${name} access", kind: prepare, skill: onboard-ros2,
       outputs: [{kind: profile, device: "${name}", pointer: /access/driver}]}
  task: {objective: "Operate ${name}", targets: ["${name}-access"]}
satellites: []
