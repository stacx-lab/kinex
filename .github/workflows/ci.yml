name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python3 -m pip install -r packages/core/test/requirements.txt -r packages/setup/test/requirements.txt
      - run: npm ci
      - run: npm run check

  python-helpers-3-10:
    # ROS 2 Humble runs the shared driver helpers under the system Python 3.10.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Python test dependencies
        run: python -m pip install -r packages/setup/test/requirements.txt
      - name: Compile shared helpers and bundles
        run: python -m compileall -q packages/core/assets/python/kinex packages/setup/assets/python/kinex_ros
      - name: Run helper unit tests
        env:
          PYTHONPATH: packages/core/assets/python:packages/setup/assets/python:packages/setup/test/fake_rclpy
        run: |
          python packages/core/test/driver_protocol_compat.py
          python packages/setup/test/ros2_helpers.py
          python packages/setup/test/bundle_helpers.py
          python packages/setup/test/ros2_drivers.py
          python packages/setup/test/ros2_check.py
