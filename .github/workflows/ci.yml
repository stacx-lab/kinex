name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python test dependencies
        run: python3 -m pip install -r packages/core/test/requirements.txt -r packages/setup/test/requirements.txt
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:core
      - run: npm run test:setup
      # Build and test standalone, including PTY and relocated package checks.
      - run: npm test
      - run: node script/release.mjs --check
